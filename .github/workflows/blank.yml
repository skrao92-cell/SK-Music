
name: SK Music APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android SDK tools
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)
          test -n "$SDKMANAGER"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

      - name: Accept Android SDK licences
        run: |
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses || true

      - name: Install Android SDK components
        run: |
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: |
          unzip -q WebTuneAndroid_source.zip -d android-project
          test -f android-project/app/build.gradle.kts

      - name: Build debug APK
        run: |
          gradle -p android-project assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SK-Music-APK
          path: android-project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
